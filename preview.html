<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Pixel Collection</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;background:#f5f0df;color:#34473c;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:26px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{font:inherit;min-height:44px;border:1px solid #b4c4a5;border-radius:10px;background:#fffdf5;color:inherit;padding:8px 12px}button[aria-pressed=true]{background:#d8e8be}.stage{min-height:360px;border-radius:18px;background:#d6e4c5;display:grid;place-items:center;overflow:hidden}canvas{max-width:100%;image-rendering:pixelated}small{color:#687360}a{color:#275e4c}</style>
<main><h1>Pokémon · Pixel collection</h1><p>Six real GLB characters converted into transparent 2D animation frames.</p>
<nav id="characters"></nav><nav><button id="idle" aria-pressed="true">Idle</button><button id="walk" aria-pressed="false">Walk</button><select id="direction" aria-label="Facing direction"><option value="down">Down / Front</option><option value="left">Left</option><option value="right">Right</option><option value="up">Up / Back</option></select><button id="pause">Pause</button></nav>
<div class="stage"><canvas width="384" height="384" id="canvas"></canvas></div><p id="status">Loading atlas…</p><small>64 / 128 px cells. Fixed per-character ground anchor. Nearest-neighbor scaling. Original clip timing.</small><p><a href="pokemon-pixel-atlas.png">Combined atlas PNG</a> · <a href="pokemon-pixel-atlas.json">Animation JSON</a></p></main><script>
const data={"pikachu": {"anchor": [32, 48], "cell": 64, "offset": [0, 1024], "durations": {"idle": 1133.3332856496174, "walk": 1000.0}}, "charizard": {"anchor": [64.0, 75.87628865979381], "cell": 128, "offset": [0, 0], "durations": {"idle": 6041.666666666667, "walk": 4041.666666666667}}, "eevee": {"anchor": [32.0, 45.92746113989637], "cell": 64, "offset": [512, 1024], "durations": {"idle": 2541.6666666666665, "walk": 2541.6666666666665}}, "gengar": {"anchor": [32.0, 48.166666666666664], "cell": 64, "offset": [1024, 1024], "durations": {"idle": 2541.6666666666665, "walk": 2541.6666666666665}}, "snorlax": {"anchor": [32.0, 46.93333333333333], "cell": 64, "offset": [1536, 1024], "durations": {"idle": 6291.666666666667, "walk": 6291.666666666667}}, "mewtwo": {"anchor": [64.0, 72.74226804123711], "cell": 128, "offset": [1024, 0], "durations": {"idle": 7541.666666666667, "walk": 4041.666666666667}}},names=Object.keys(data),rows={idle:{down:0,left:1,right:2,up:3},walk:{down:4,left:5,right:6,up:7}};
const ctx=document.querySelector('#canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
let character='pikachu',action='idle',direction='down',started=performance.now(),paused=false,pausedAt=0,ready=false;
function reset(){started=performance.now();if(paused)pausedAt=started;}
for(const name of names){let b=document.createElement('button');b.textContent=name[0].toUpperCase()+name.slice(1);b.dataset.character=name;b.setAttribute('aria-pressed',name===character);b.onclick=()=>{character=name;reset();document.querySelectorAll('[data-character]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.character===name));};document.querySelector('#characters').append(b);}
for(const a of ['idle','walk'])document.querySelector('#'+a).onclick=()=>{action=a;reset();for(const k of ['idle','walk'])document.querySelector('#'+k).setAttribute('aria-pressed',k===a);};
document.querySelector('#direction').onchange=e=>{direction=e.target.value;};document.querySelector('#pause').onclick=()=>{paused=!paused;if(paused)pausedAt=performance.now();else started+=performance.now()-pausedAt;document.querySelector('#pause').textContent=paused?'Resume':'Pause';};
const atlas=new Image();atlas.onload=()=>{ready=true;reset();};atlas.onerror=()=>document.querySelector('#status').textContent='Atlas failed to load. Keep the HTML beside pokemon-pixel-atlas.png.';atlas.src='pokemon-pixel-atlas.png';
function render(now){if(ready){const model=data[character],cell=model.cell,frame=Math.floor(Math.max(0,(paused?pausedAt:now)-started)/model.durations[action]*8)%8;ctx.clearRect(0,0,384,384);let anchor=model.anchor;ctx.fillStyle='#84936755';ctx.beginPath();ctx.ellipse(192,304,cell*.55,13,0,0,Math.PI*2);ctx.fill();ctx.drawImage(atlas,model.offset[0]+frame*cell,model.offset[1]+rows[action][direction]*cell,cell,cell,192-anchor[0]*3,300-anchor[1]*3,cell*3,cell*3);document.querySelector('#status').textContent=`${character.toUpperCase()} · ${action.toUpperCase()} · ${direction.toUpperCase()} · frame ${frame+1}/8`;}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
